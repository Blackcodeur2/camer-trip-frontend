<div class="validate-page">
    <header class="page-header">
        <h1>Validation des Tickets</h1>
        <p>Saisissez le code du ticket pour valider.</p>
    </header>

    <div class="scanner-mock">
        <div class="scanner-box">
            <mat-icon class="camera-icon">qr_code_scanner</mat-icon>
            <div class="scan-line"></div>
            <p>Scannez le QR Code du client</p>
        </div>

        <div class="manual-input">
            <span>OU</span>
            <div class="input-group">
                <input type="text" [(ngModel)]="validationCode" placeholder="Entrer le code manuellement">
                <button class="btn-verify" (click)="verifyCode()" [disabled]="isValidating()">{{ isValidating() ?
                    'Vérification...' : 'Vérifier' }}</button>
            </div>
        </div>

        <div *ngIf="resultMessage()" class="validation-result" [class.success]="validationSuccess()"
            [class.error]="!validationSuccess()">
            {{ resultMessage() }}
        </div>
    </div>
</div>
