<div class="dashboard-container">

  @if (isLoading()) {
    <div class="loading">
      <div class="spinner"></div>
      <p>Chargement des statistiques...</p>
    </div>
  } @else if (stats()) {
    <!-- Dashboard Stats Grid (the rest of the original content) -->
    <div class="stats-grid">
      @for (item of statItems; track item.key) {
        <div class="stat-card">
          <div class="stat-info">
            <span class="value">{{ getStatValue(item.key) }}</span>
            <span class="label">{{ item.label }}</span>
          </div>
          <div class="stat-icon">
            <mat-icon>{{ item.icon }}</mat-icon>
          </div>
        </div>
      }
    </div>

    <!-- Activity Chart -->
    <section class="panel chart-card animate-fade-in">
      <div class="panel-header">
        <h2>Activité de mes Agences</h2>
        <span class="badge badge-soft">Cette année</span>
      </div>
      <div class="chart-container">
        <canvas id="activityChart"></canvas>
      </div>
    </section>
  }
</div>
