<div class="booking-container">
    <header class="page-header animate-fade-in">
        <h2 class="title">Réserver un Voyage</h2>
        <p class="subtitle">Sélectionnez un trajet pour réserver votre place</p>
    </header>

    <div class="search-bar animate-scale-in">
        <mat-icon>search</mat-icon>
        <input type="text" [(ngModel)]="searchQuery" placeholder="Rechercher une destination...">
    </div>

    <div *ngIf="isLoading()" class="loading-state">
        <div class="skeleton-card" *ngFor="let i of [1,2,3]"></div>
    </div>

    <div *ngIf="!isLoading()" class="voyages-grid">
        <div class="voyage-card animate-in" *ngFor="let v of voyages(); let i = index" 
             [style.animation-delay]="(i * 0.05) + 's'" (click)="selectVoyage(v.id)">
            <div class="card-body">
                <div class="route-info">
                    <span class="city">{{ v.trajet?.depart }}</span>
                    <mat-icon>trending_flat</mat-icon>
                    <span class="city">{{ v.trajet?.arrivee }}</span>
                </div>
                <div class="time-info">
                    <mat-icon>schedule</mat-icon>
                    {{ v.date_depart | date:'dd MMM' }} à {{ v.heure_depart }}
                </div>
                <div class="price-tag">{{ v.prix | number }} FCFA</div>
            </div>
        </div>

        <div class="empty-state" *ngIf="voyages().length === 0">
            <mat-icon>event_busy</mat-icon>
            <p>Aucun voyage disponible pour le moment.</p>
        </div>
    </div>
</div>
