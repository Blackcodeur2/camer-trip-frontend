<main class="auth">
  <section class="auth__card" aria-label="Connexion">
    <header class="auth__header">
      <h1 class="auth__title">Connexion</h1>
      <p class="auth__subtitle">Content de vous revoir sur <strong>{{ 'appName' }}</strong></p>
    </header>

    <form class="auth__form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="field">
        <label class="field__label" for="login">Email ou nom d'utilisateur</label>
        <div class="input-container">
          <span class="input-icon"><mat-icon>person</mat-icon></span>
          <input id="login" class="field__control" type="text" formControlName="login" inputmode="text"
            autocomplete="username" placeholder="email ou nom d'utilisateur" />
        </div>
        @if (shouldShowError('login')) {
        <div class="field__error">{{ errorMessage('login') }}</div>
        }
      </div>

      <div class="field">
        <label class="field__label" for="password">Mot de passe</label>
        <div class="input-container">
          <span class="input-icon"><mat-icon>lock</mat-icon></span>
          <input id="password" class="field__control" [type]="showPassword() ? 'text' : 'password'" formControlName="password"
            autocomplete="current-password" placeholder="••••••••" />
          <button type="button" class="password-toggle" (click)="showPassword.update(v => !v)" aria-label="Afficher ou masquer le mot de passe">
            <mat-icon>{{ showPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        @if (shouldShowError('password')) {
        <div class="field__error">{{ errorMessage('password') }}</div>
        }
      </div>

      <div class="forgot-password">
        <a routerLink="/auth/forgot-password">Mot de passe oublié ?</a>
      </div>

      <app-app-button type="submit" variant="auth__primary" [loading]="isLoading()" loadingText="Connexion en cours...">
        Se connecter
      </app-app-button>

      <div class="auth__footer">
        Vous n'avez pas encore de compte ? <a routerLink="/auth/register">S'inscrire</a>
      </div>

    </form>
  </section>
</main>
