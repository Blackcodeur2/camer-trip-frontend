<div class="chauffeur-layout">
  <!-- Premium Top Bar -->
  <header class="app-header">
    <div class="user-profile">
      <div class="avatar" style="overflow: hidden;">
        @if (currentUser()?.profil_url) {
          <img [src]="currentUser()?.profil_url" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
        } @else {
          {{ initials() }}
        }
      </div>
      <div class="welcome-text">
        <span class="greeting">{{ greeting }}</span>
        <span class="username">{{ currentUser()?.prenom }}</span>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </header>

  <!-- Main Viewport -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Floating Bottom Nav -->
  <nav class="bottom-nav-container">
    <div class="bottom-nav">
      <a routerLink="/chauffeur/dashboard" routerLinkActive="active" class="nav-item">
        <div class="icon-wrapper">
          <mat-icon>dashboard</mat-icon>
        </div>
        <span>Accueil</span>
      </a>
      <a routerLink="/chauffeur/historique" routerLinkActive="active" class="nav-item">
        <div class="icon-wrapper">
          <mat-icon>history</mat-icon>
        </div>
        <span>Historique</span>
      </a>
      <a routerLink="/chauffeur/incident" routerLinkActive="active" class="nav-item">
        <div class="icon-wrapper">
          <mat-icon>report_problem</mat-icon>
        </div>
        <span>Incident</span>
      </a>
      <a routerLink="/chauffeur/profile" routerLinkActive="active" class="nav-item">
        <div class="icon-wrapper">
          <mat-icon>person</mat-icon>
        </div>
        <span>Profil</span>
      </a>
    </div>
  </nav>
</div>
